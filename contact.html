<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Me - Aphiwe Lukho Bija</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section id="contact" class="contact-section">
      <header class="top-bar">
        <h2 class="logo">Aphiwe</h2>
        <nav class="nav-center">
          <a href="index.html">Home</a>
          <a href="about.html">About me</a>
          <a href="gallery.html">Gallery</a>
          <a href="goals.html">My goals</a>
        </nav>
      </header>

      <div class="contact-bg">
        <img
          src="https://i.ibb.co/rGQ067W2/IMG-1049-2.jpg"
          alt="Aphiwe contact background"
          class="contact-pic"
        />
      </div>

      <h1 class="contact-title">Contact Me</h1>

      <form
        class="contact-form"
        action="https://formsubmit.co/aphiwelukhobija@gmail.com"
        method="POST"
      >
        <!-- FormSubmit settings -->
        <input type="hidden" name="_subject" value="New Portfolio Message!" />
        <input type="hidden" name="_captcha" value="false" />
        <input type="hidden" name="_next" value="thankyou.html" />

        <div class="form-group">
          <label for="name">Full Name</label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your name"
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Enter your email"
          />
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input
            type="text"
            id="subject"
            name="subject"
            required
            placeholder="What is this about?"
          />
        </div>

        <div class="form-group">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            rows="5"
            required
            placeholder="Write your message here..."
          ></textarea>
        </div>

        <button type="submit">Send Message</button>
      </form>

      <div class="contact-info">
        <p>Or reach me directly at: aphiwelukhobija@gmail.com</p>
      </div>
    </section>
  </body>
</html>
